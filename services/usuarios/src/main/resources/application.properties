spring.application.name=tiendatech-usuarios
server.port=8085

spring.datasource.url=${CRDB_DATASOURCE_URL:jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}
spring.datasource.username=${CRDB_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRDB_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.proc.param_null_passing=true
spring.jpa.properties.hibernate.default_schema=usuarios

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${TT_MAIL_USERNAME}
spring.mail.password=${TT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

otp.ttl-minutes=10
otp.length=6
otp.resend.cooldown-seconds=60
otp.rate.max-per-15min=3
otp.mail-fallback.enabled=${OTP_MAIL_FALLBACK_ENABLED:true}

auth.access.minutes=10
auth.absolute.hours=8
auth.cookie.domain=localhost
auth.cookie.secure=false
auth.cookie.samesite=Lax
auth.jwt.secret=${AUTH_JWT_SECRET}

auth.idle.ADMIN=${AUTH_IDLE_ADMIN_MINUTES:30}
auth.idle.TRABAJADOR=${AUTH_IDLE_TRABAJADOR_MINUTES:30}
auth.idle.CLIENTE=${AUTH_IDLE_CLIENTE_MINUTES:0}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8180}
app.upload-root=${APP_UPLOAD_ROOT:${user.dir}/uploads}

# Trazado distribuido (Paso 10): OTLP hacia el colector Jaeger local, muestreo
# al 100% para que toda operacion quede trazada durante la evidencia del Paso
# 10 (en una entrega real con trafico de produccion se bajaria este valor).
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://tiendatech-jaeger:4318/v1/traces}

# Punto 5: Flyway gestiona su propio historial dentro del esquema usuarios;
# no toca ni requiere que existan los demas esquemas.
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios
spring.flyway.create-schemas=true
