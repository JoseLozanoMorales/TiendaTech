spring.application.name=tiendatech-usuarios
server.port=8085

spring.datasource.url=${CRDB_DATASOURCE_URL:jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}
spring.datasource.username=${CRDB_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRDB_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.proc.param_null_passing=true
spring.jpa.properties.hibernate.default_schema=usuarios

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${TT_MAIL_USERNAME}
spring.mail.password=${TT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

otp.ttl-minutes=10
otp.length=6
otp.resend.cooldown-seconds=60
otp.rate.max-per-15min=3
otp.mail-fallback.enabled=${OTP_MAIL_FALLBACK_ENABLED:true}

auth.access.minutes=10
auth.absolute.hours=8
# Hallazgo real (punto 14, camino critico autenticado con Locust): con
# Domain=localhost, el navegador y curl reenvian la cookie "refresh" sin
# problema, pero el cookiejar estandar de Python (http.cookiejar, usado por
# requests/Locust) descarta en silencio cualquier atributo Domain sin un
# punto incrustado -- la unica excepcion que reconoce esa politica es el
# literal ".local", no "localhost". Se reprodujo con un requests.Session
# identico al que usa Locust: el Set-Cookie llega, requests lo guarda, pero
# jamas lo reenvia en la siguiente peticion al mismo host, y /auth/refresh
# falla 100% con MissingRequestCookieException bajo carga. Domain vacio deja
# la cookie "host-only" (RFC 6265 la permite; el navegador la sigue
# reenviando igual al mismo host), y esa politica de Python SI la acepta.
# Queda parametrizable por si un despliegue real necesita fijar un dominio
# con punto (p.ej. "tiendatech.example.com").
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cookie.secure=false
auth.cookie.samesite=Lax
auth.jwt.secret=${AUTH_JWT_SECRET}

auth.idle.ADMIN=${AUTH_IDLE_ADMIN_MINUTES:30}
auth.idle.TRABAJADOR=${AUTH_IDLE_TRABAJADOR_MINUTES:30}
auth.idle.CLIENTE=${AUTH_IDLE_CLIENTE_MINUTES:0}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8180}
app.upload-root=${APP_UPLOAD_ROOT:${user.dir}/uploads}

# Trazado distribuido (Paso 10): OTLP hacia el colector Jaeger local, muestreo
# al 100% para que toda operacion quede trazada durante la evidencia del Paso
# 10 (en una entrega real con trafico de produccion se bajaria este valor).
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://tiendatech-jaeger:4318/v1/traces}

# Punto 5: Flyway gestiona su propio historial dentro del esquema usuarios;
# no toca ni requiere que existan los demas esquemas.
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios
spring.flyway.create-schemas=true

# Hallazgo real (preparacion del punto 14, 2026-09-15; revertido en el punto 5
# tras una segunda revision): este entorno local tuvo el esquema "usuarios"
# con tablas ya creadas pero sin flyway_schema_history (probablemente porque
# tiendatech-crdb-init reinicializo el esquema sin recrear esa tabla en algun
# `docker compose up` anterior a que el equipo adoptara Flyway aqui). En ese
# momento se resolvio con baseline-on-migrate=true + baseline-version=1, pero
# esa bandera quedaba fija en el archivo committeado -- activa en CI, en
# produccion y en cualquier clon del repo -- y le dice a Flyway "trata V1
# como ya aplicado" sin verificar que el esquema realmente coincide con V1:
# si algun esquema queda con columnas o cambios que no vinieron de Flyway,
# esta bandera los acepta en silencio en vez de que Flyway detecte la
# divergencia (Found non-empty schema(s) but no schema history table), que
# es justamente la funcion de este punto.
#
# La recuperacion correcta -- verificada contra CockroachDB real al cerrar
# este punto, dos veces, para inventario-service y pedidos-service -- es
# vaciar el esquema y dejar que Flyway lo reconstruya desde cero, no
# baselinearlo:
#   docker exec -it tiendatech-crdb-1 cockroach sql --insecure \
#     --host=localhost:26257 --database=tiendatech \
#     --execute="DROP SCHEMA IF EXISTS usuarios CASCADE;"
#   docker compose -f docker-compose.yml up -d --build tiendatech-usuarios
# Esto reaplica V1 real (no un baseline ciego) y deja intacta la deteccion
# de deriva para el resto de casos.

# Hallazgo real (punto 14, carga con 20 usuarios concurrentes): la rotacion
# de RefreshTokenService.refresh() (lectura + dos escrituras sobre
# refresh_sessions en una sola transaccion) puede chocar con otra rotacion
# concurrente bajo aislamiento serializable de CockroachDB y recibir
# SQLSTATE 40001 (TransactionRetryWithProtoRefreshError). No es un bug de la
# app -- es el contrato normal de una base distribuida con control de
# concurrencia optimista -- pero sin reintento se propagaba como HTTP 500 al
# cliente. pedidos-service e inventario-service ya tenian este mismo
# tratamiento (CrdbRetryExecutor / CrdbTransactionRetryExecutor) para sus
# propias transacciones multi-escritura; usuarios-service era el unico
# servicio con una transaccion asi sin reintento. Mismos valores por defecto
# que inventario-service para mantener consistencia entre servicios.
crdb.retry.max-attempts=${CRDB_RETRY_MAX_ATTEMPTS:10}
crdb.retry.initial-delay-ms=${CRDB_RETRY_INITIAL_DELAY_MS:100}
crdb.retry.max-delay-ms=${CRDB_RETRY_MAX_DELAY_MS:2000}
