spring.application.name=tiendatech-pedidos
server.port=${SERVER_PORT:8083}
coordination.strategy=${COORD:2pc}

spring.datasource.url=${CRDB_DATASOURCE_URL:jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}
spring.datasource.username=${CRDB_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRDB_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_SERIALIZABLE
spring.datasource.hikari.maximum-pool-size=${CRDB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${CRDB_POOL_MIN_IDLE:2}

crdb.retry.max-attempts=${CRDB_RETRY_MAX_ATTEMPTS:3}
crdb.retry.delay-ms=${CRDB_RETRY_DELAY_MS:100}

spring.sql.init.mode=never
logging.level.org.springframework=INFO

management.endpoints.web.exposure.include=health,prometheus,circuitbreakers
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# D6.1: http.server.requests -> http_server_requests_seconds_count/_sum (equivalente
# Micrometer de http_requests_total/http_request_duration_seconds de la rubrica).
# Histograma habilitado para que Grafana pueda calcular percentiles de latencia,
# no solo el promedio.
management.metrics.enable.http=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

ventas.service.base-url=${VENTAS_SERVICE_URL:http://localhost:8086}
productos.service.base-url=${PRODUCTOS_SERVICE_URL:http://localhost:8081}
usuarios.service.base-url=${USUARIOS_SERVICE_URL:http://localhost:8085}

pedidos.http-client.connect-timeout-ms=${HTTP_CLIENT_CONNECT_TIMEOUT_MS:2000}
pedidos.http-client.read-timeout-ms=${HTTP_CLIENT_READ_TIMEOUT_MS:5000}
pedidos.factura-client.connect-timeout-ms=${FACTURA_HTTP_CLIENT_CONNECT_TIMEOUT_MS:2000}
pedidos.factura-client.read-timeout-ms=${FACTURA_HTTP_CLIENT_READ_TIMEOUT_MS:30000}

# Circuit breaker en las 3 dependencias externas. facturaClient es una escritura
# (POST factura): sin reintento, solo circuit breaker. productoClient y
# usuarioClient son solo lecturas (GET): circuit breaker + reintento.
resilience4j.circuitbreaker.instances.facturaClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.facturaClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.facturaClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.facturaClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.facturaClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.facturaClient.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.productoClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.productoClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productoClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productoClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productoClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productoClient.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.usuarioClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.usuarioClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.usuarioClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usuarioClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.usuarioClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.usuarioClient.automatic-transition-from-open-to-half-open-enabled=true

# retry-exceptions es una lista blanca deliberada: solo fallas transitorias
# (timeout/IO, 5xx). Un 4xx (ej. "producto no encontrado") NUNCA se reintenta.
resilience4j.retry.instances.productoClient.max-attempts=3
resilience4j.retry.instances.productoClient.wait-duration=200ms
resilience4j.retry.instances.productoClient.enable-exponential-backoff=true
resilience4j.retry.instances.productoClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.productoClient.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.retry.instances.usuarioClient.max-attempts=3
resilience4j.retry.instances.usuarioClient.wait-duration=200ms
resilience4j.retry.instances.usuarioClient.enable-exponential-backoff=true
resilience4j.retry.instances.usuarioClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.usuarioClient.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Idempotency-Key de checkout: apagado por defecto porque la tabla
# pedidos.solicitud_idempotente todavia no existe en docs/db/schema.sql
# (ver services/pedidos-service/docs/idempotencia.sql). Con esta bandera en
# false, JdbcIdempotenciaRepository no se registra como bean y el checkout se
# comporta exactamente igual que antes, header presente o no.
pedidos.idempotencia.enabled=${PEDIDOS_IDEMPOTENCIA_ENABLED:false}

reservation.tcp.host=${RESERVATION_TCP_HOST:localhost}
reservation.tcp.port=${RESERVATION_TCP_PORT:9091}
reservation.tcp.connect-timeout-ms=${RESERVATION_TCP_CONNECT_TIMEOUT_MS:2000}
reservation.tcp.read-timeout-ms=${RESERVATION_TCP_READ_TIMEOUT_MS:5000}

# Trazado distribuido (Paso 10): OTLP hacia el colector Jaeger local, muestreo
# al 100% para que toda operacion quede trazada durante la evidencia del Paso
# 10 (en una entrega real con trafico de produccion se bajaria este valor).
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://tiendatech-jaeger:4318/v1/traces}
