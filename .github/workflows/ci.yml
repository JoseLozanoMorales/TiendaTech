name: CI

on:
  push:
    branches: [main, feature/entrega-3, feature/entrega-4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  line-endings:
    name: Fin de linea LF en todo el repo (excepto *.cmd)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify tracked text files use LF line endings
        run: |
          offenders=$(git ls-files --eol | grep -E 'i/(crlf|mixed)' | grep -v '\.cmd$' || true)
          if [ -n "$offenders" ]; then
            echo "Archivos con CRLF/mixed en el indice (deben normalizarse a LF via .gitattributes, o declarar la excepcion si es intencional):"
            echo "$offenders"
            exit 1
          fi

  openapi-contracts:
    name: OpenAPI generation and route coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/openapi/requirements.txt
            services/armado-ia/requirements.txt
      - name: Install OpenAPI export and validation dependencies
        run: pip install -r scripts/openapi/requirements.txt
      - name: Test contract validation failures
        run: python -m unittest discover -s scripts/openapi -p 'test_*.py' -v
      - name: Regenerate and compare all contracts
        run: python scripts/openapi/generate.py --check
      - name: Preserve framework exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-framework-exports
          path: services/*/target/openapi/*.json
          if-no-files-found: ignore

  manuscript-quality:
    name: Validar evidencia y compilar manuscrito (E4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código con historial completo
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 es obligatorio aquí: el validador resuelve commits
          # históricos citados en el manuscrito (no solo HEAD). Un clon
          # superficial (el default) haría que git no encuentre esos objetos
          # y el validador reportaría como "archivo inexistente" algo que sí
          # existe, solo que fuera del historial descargado.
          fetch-depth: 0

      - name: Validar referencias de evidencia citadas en el manuscrito
        run: python3 scripts/validate_evidence_refs.py

      - name: Compilar PFC4.tex (imagen TeX Live completa; latexmk resuelve pdflatex/biber)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PFC4.tex
          working_directory: docs/entrega4

      - name: Conservar el PDF compilado como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PFC4-compilado
          path: docs/entrega4/PFC4.pdf
          if-no-files-found: ignore

  backend-complexity:
    name: Complejidad ciclomatica del backend (PMD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Medir complejidad ciclomatica de los 7 servicios Java
        shell: pwsh
        run: ./scripts/measure-cyclomatic-complexity.ps1

      - name: Fallar si algun metodo alcanza el umbral (>=10)
        shell: pwsh
        run: |
          $rows = Import-Csv docs/experimentos/resultados/iso25010/complejidad/summary.csv
          $rows | Format-Table -AutoSize
          $incumple = $rows | Where-Object { $_.status -ne "CUMPLE" }
          if ($incumple) {
            Write-Host "::error::Complejidad >= 10 en: $($incumple.module -join ', ')"
            exit 1
          }

      - name: Conservar reportes de PMD como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-complejidad
          path: docs/experimentos/resultados/iso25010/complejidad/
          if-no-files-found: ignore
  coverage-java:
    name: Cobertura Java (JaCoCo) - ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: inventario-service
            directorio: services/inventario-service
            archivo: inventario-service-jacoco.xml
          - nombre: productos-service
            directorio: services/productos-service
            archivo: productos-service-jacoco.xml
          - nombre: ordenes-proveedores-service
            directorio: services/ordenes-proveedores-service
            archivo: ordenes-proveedores-service-jacoco.xml
          - nombre: pedidos-service
            directorio: services/pedidos-service
            archivo: pedidos-service-jacoco.xml
          - nombre: usuarios
            directorio: services/usuarios
            archivo: usuarios-jacoco.xml
          - nombre: ventas-service
            directorio: services/ventas-service
            archivo: ventas-service-jacoco.xml
          - nombre: gateway
            directorio: Apps/web/frontend
            archivo: gateway-jacoco.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.directorio }}/pom.xml
      - name: mvn test (genera jacoco.xml real de esta corrida)
        working-directory: ${{ matrix.directorio }}
        run: mvn -B -ntp test
      - name: Renombrar el reporte al nombre versionado
        run: cp "${{ matrix.directorio }}/target/site/jacoco/jacoco.xml" "${{ matrix.archivo }}"
      - name: Subir el reporte de esta corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.nombre }}
          path: ${{ matrix.archivo }}
          if-no-files-found: ignore

  coverage-armado-ia:
    name: Cobertura Python (pytest-cov) - armado-ia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/armado-ia/requirements.txt
            services/armado-ia/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/armado-ia
        run: pip install -r requirements-dev.txt
      - name: pytest --cov (genera armado-ia-coverage.xml real de esta corrida)
        working-directory: services/armado-ia
        run: python -m pytest --cov=app --cov-report=xml:../../armado-ia-coverage.xml
      - name: Subir el reporte de esta corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-armado-ia
          path: armado-ia-coverage.xml
          if-no-files-found: ignore

  coverage-threshold:
    name: Umbral de cobertura declarado (70%, informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [coverage-java, coverage-armado-ia]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar los 8 reportes de esta corrida
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: docs/evidencias/cobertura
          merge-multiple: true
      # Punto 15 de la guia de cierre: el docente marco que verificar_umbral.py
      # no se invocaba en ningun workflow y que los XML de cobertura no se
      # regeneraban en CI. Los jobs coverage-java/coverage-armado-ia de arriba
      # corren mvn test / pytest --cov de verdad en esta misma corrida (no
      # reusan los XML versionados en el repo), y este job verifica el umbral
      # contra esos reportes recien generados. Es deliberadamente no
      # bloqueante (continue-on-error) porque 7 de 8 servicios estan hoy por
      # debajo del 70% real y un gate duro dejaria el pipeline en rojo
      # permanente mientras crece la suite de pruebas.
      - name: Verificar umbral de cobertura contra los reportes de esta corrida
        id: umbral
        continue-on-error: true
        run: python3 docs/evidencias/cobertura/verificar_umbral.py --salida informe-umbral-70-ci.json
      - name: Anotar resultado del umbral en el resumen del job
        run: |
          cat informe-umbral-70-ci.json
          if [ "${{ steps.umbral.outcome }}" = "success" ]; then
            echo "::notice::Umbral de 70% de cobertura: CUMPLE en todos los servicios (corrida en vivo)."
          else
            echo "::warning::Umbral de 70% de cobertura: NO CUMPLE todavia en uno o mas servicios (corrida en vivo; meta declarada, no bloqueante mientras crece la suite; ver docs/evidencias/cobertura/README.md)."
          fi
      - name: Conservar el informe de umbral de esta corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-umbral-70-ci
          path: informe-umbral-70-ci.json
          if-no-files-found: ignore
  web-quality:
    needs: backend-complexity
    if: ${{ !cancelled() }}
    name: Web lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/web/frontend/webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: Apps/web/frontend/webapp
        run: npm ci
      - name: Download freshly measured backend complexity
        uses: actions/download-artifact@v4
        with:
          name: pmd-complejidad
          path: docs/experimentos/resultados/iso25010/complejidad/
      - name: Measure web cyclomatic complexity (maximum <10)
        working-directory: Apps/web/frontend/webapp
        run: npm run complexity:report
      - name: Run web static analysis (ESLint)
        if: ${{ !cancelled() }}
        working-directory: Apps/web/frontend/webapp
        run: npm run lint:report
      - name: Upload web static analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-static-analysis
          path: |
            docs/experimentos/resultados/iso25010/complejidad/summary.csv
            docs/experimentos/resultados/iso25010/complejidad/webapp-complexity.json
            docs/experimentos/resultados/iso25010/complejidad/webapp-eslint.json
            docs/experimentos/resultados/iso25010/complejidad/webapp-eslint-summary.csv
          if-no-files-found: error
      - name: Check web and test TypeScript types
        if: ${{ !cancelled() }}
        working-directory: Apps/web/frontend/webapp
        run: npx tsc -p tsconfig.test.json
      - name: Run web unit tests with coverage (Vitest)
        id: web-tests
        if: ${{ !cancelled() }}
        working-directory: Apps/web/frontend/webapp
        run: npm run test:coverage -- --reporter=verbose
      - name: Summarize component coverage
        if: ${{ !cancelled() && steps.web-tests.outcome == 'success' }}
        working-directory: Apps/web/frontend/webapp
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { basename } from 'node:path';
          const report = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const files = Object.entries(report).filter(([key]) => key !== 'total');
          const rows = files.map(([file, m]) =>
            `| ${basename(file)} | ${m.lines.pct}% | ${m.statements.pct}% | ${m.branches.pct}% | ${m.functions.pct}% |`);
          const alcance = files.map(([file]) => basename(file)).sort().join(', ');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            ['## Cobertura web', '| Componente | Líneas | Sentencias | Ramas | Funciones |',
             '|---|---:|---:|---:|---:|', ...rows, '',
             `Alcance: ${alcance}, con servicios HTTP simulados. Se listan automáticamente desde vitest.config.ts (coverage.include).`, ''].join('\n'));
          JS
      - name: Upload web coverage
        if: ${{ !cancelled() && steps.web-tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: Apps/web/frontend/webapp/coverage/
          if-no-files-found: error

  contract-tests:
    name: Pact consumer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/contract/package-lock.json
      - name: Install contract-test dependencies
        working-directory: tests/contract
        run: npm ci
      - name: Generate and validate Pact contracts
        working-directory: tests/contract
        run: npm test
      - name: Fail if the regenerated contracts drifted from the committed ones
        working-directory: tests/contract
        run: git diff --exit-code -- pacts/
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/contract/pacts/*.json
          if-no-files-found: error

  provider-verification-usuarios:
    name: Pact provider verification (usuarios-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml
      - name: Verify usuarios-service against the local mobile-login pact
        working-directory: services/usuarios
        run: mvn -B -ntp -Ppact -Dtest=com.tiendatech.usuarios.contract.UsuariosProviderVerificationTest test

  provider-verification-productos:
    name: Pact provider verification (productos-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml
      - name: Verify productos-service against the local web-catalog pact
        working-directory: services/productos-service
        run: mvn -B -ntp -Ppact -Dtest=com.tiendatech.productos.contract.ProductosProviderVerificationTest test

  e2e-web:
    name: Playwright web E2E
    runs-on: ubuntu-latest
    # El interceptor global que respondía sin backend permitía terminar en
    # minutos; el sistema completo (3 nodos CockroachDB + 7 microservicios +
    # gateway, todos compilados desde cero) tarda bastante más en levantarse.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Apps/web/frontend/webapp/package-lock.json
            tests/e2e-web/package-lock.json
      - name: Install webapp dependencies
        working-directory: Apps/web/frontend/webapp
        run: npm ci
      - name: Install E2E dependencies
        working-directory: tests/e2e-web
        run: npm ci
      - name: Install Chromium
        working-directory: tests/e2e-web
        run: npx playwright install --with-deps chromium

      # --- Punto 13: el sistema real, no un interceptor, es lo que responde ---
      - name: Levantar el sistema completo (CRDB + microservicios + gateway)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build --wait --wait-timeout 900
      - name: Sembrar datos deterministas para las pruebas E2E
        run: |
          docker compose exec -T tiendatech-crdb-1 \
            cockroach sql --insecure --host=localhost:26257 --file=/dev/stdin \
            < docs/db/seed-e2e.sql
      - name: Verificar que el gateway responde con datos reales
        env:
          # Punto 17 de la guia de cierre: /health ahora exige el token de
          # observabilidad (ver JwtGatewayFilter). Este runner de CI no
          # sobrescribe OBSERVABILITY_TOKEN, asi que el Gateway arranca con
          # el valor por defecto de docker-compose.yml -- se usa el mismo
          # aqui. /api/productos es una ruta de lectura publica y no lo
          # necesita.
          OBSERVABILITY_TOKEN: TiendaTechObservabilidadToken2026Seguro
        run: |
          curl --fail --silent -H "Authorization: Bearer $OBSERVABILITY_TOKEN" http://localhost:8080/health
          curl --fail --silent http://localhost:8080/api/productos | grep -q 'Procesador Ryzen 7'

      - name: Run browser journeys
        working-directory: tests/e2e-web
        run: npm test
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e-web/playwright-report/
            tests/e2e-web/test-results/
          if-no-files-found: ignore
      - name: Registrar logs del sistema (diagnóstico si algo falló)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > docker-compose.log 2>&1 || true
      - name: Subir logs del sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-system-logs
          path: docker-compose.log
          if-no-files-found: ignore
      - name: Apagar el sistema
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  android-mobile:
    name: Android mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # El paquete "tools" heredado ya fue retirado por Google del
          # repositorio del SDK; el input "packages" del action lo pide por
          # defecto si no se sobreescribe, y eso rompe el paso. platform-tools
          # es lo único que necesitamos aquí (platform y build-tools se
          # instalan en el paso siguiente).
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and build Android app
        working-directory: Apps/mobile
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tiendatech-android-debug
          path: |
            Apps/mobile/app/build/outputs/apk/debug/*.apk
            Apps/mobile/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            Apps/mobile/app/build/reports/
            Apps/mobile/app/build/test-results/
          if-no-files-found: ignore

  crdb-tests:
    name: CockroachDB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/pedidos-service/pom.xml

      - name: Run pedidos-service tests with Testcontainers
        working-directory: services/pedidos-service
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crdb-test-reports
          path: services/pedidos-service/target/surefire-reports/
          if-no-files-found: ignore

  db-migrations-clean-start:
    name: Esquema desde cero solo con migraciones (Punto 5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Punto 5: docker-compose.yml ya no monta ni aplica docs/db/schema.sql
      # en tiendatech-crdb-init (ver docs/db/README.md). Este job levanta un
      # cluster CockroachDB realmente vacio -- sin schema.sql, sin seeds -- y
      # arranca los seis microservicios que tienen esquema propio; Compose
      # resuelve solo sus dependencias reales (crdb-1/2/3, crdb-init,
      # jaeger y, entre ellos, pedidos->usuarios/productos/ventas,
      # ordenes-proveedores->inventario), sin gateway/armado-ia/observabilidad
      # porque nada de esto necesita esquema propio.
      - name: Levantar CRDB vacio y los seis servicios con esquema propio
        run: |
          docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 900 \
            tiendatech-usuarios tiendatech-productos tiendatech-inventario \
            tiendatech-pedidos tiendatech-ordenes-proveedores tiendatech-ventas

      - name: Verificar que las 35 tablas y los 6 historiales Flyway existen
        run: |
          cat > /tmp/verificar-esquema.sql <<'SQL'
          SELECT table_schema || '.' || table_name AS tabla
          FROM information_schema.tables
          WHERE table_schema IN ('usuarios','pedidos','productos','inventario','ordenes_proveedores','ventas')
            AND table_name <> 'flyway_schema_history'
          ORDER BY 1;
          SQL
          docker compose -f docker-compose.yml exec -T tiendatech-crdb-1 \
            cockroach sql --insecure --host=localhost:26257 --database=tiendatech \
            --format=csv --file=/dev/stdin < /tmp/verificar-esquema.sql \
            | tail -n +2 | tr -d '\r' > /tmp/tablas-reales.txt

          # 35, no 33: inventario.reserva_stock y inventario.operacion_reserva
          # (reserva de stock con reloj Lamport) se agregaron originalmente
          # fuera de Flyway (InventarioSchemaInitializer, @PostConstruct) y
          # el esquema real de inventario ya tenia 35 tablas desde antes del
          # punto 5. Se corrigio ese bypass trasladando ambas tablas y el
          # indice a inventario-service/.../db/migration/V3__reserva_stock_lamport.sql:
          # ahora las 35 tablas, incluidas estas dos, salen solo de Flyway.
          #
          # docs/db/tablas-esperadas.txt es la unica fuente de esta lista:
          # tambien la usa el job "schema-sql-equivalencia" de mas abajo, que
          # compara el mismo archivo contra docs/db/schema.sql. Que ambos
          # jobs lean el mismo archivo es lo que hace automatica la deteccion
          # de que las migraciones y schema.sql dejen de coincidir.
          sort docs/db/tablas-esperadas.txt -o /tmp/tablas-esperadas.txt
          sort /tmp/tablas-reales.txt -o /tmp/tablas-reales.txt

          echo "--- Tablas creadas por las migraciones ---"
          cat /tmp/tablas-reales.txt
          echo "--- Diferencia contra docs/db/tablas-esperadas.txt (vacio = OK) ---"
          diff /tmp/tablas-esperadas.txt /tmp/tablas-reales.txt

          echo "--- flyway_schema_history por esquema (V1, o V1+V2) ---"
          for esquema in usuarios productos inventario pedidos ordenes_proveedores ventas; do
            echo "== $esquema =="
            docker compose -f docker-compose.yml exec -T tiendatech-crdb-1 \
              cockroach sql --insecure --host=localhost:26257 --database=tiendatech \
              --execute="SELECT version, success FROM ${esquema}.flyway_schema_history ORDER BY installed_rank;"
          done

      - name: Registrar logs del sistema (diagnostico si algo fallo)
        if: always()
        run: docker compose -f docker-compose.yml logs --no-color > db-migrations-clean-start.log 2>&1 || true

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-migrations-clean-start-logs
          path: db-migrations-clean-start.log
          if-no-files-found: ignore

      - name: Apagar el sistema
        if: always()
        run: docker compose -f docker-compose.yml down -v

  schema-sql-equivalencia:
    name: docs/db/schema.sql equivale a las migraciones (Punto 5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Punto 5, hallazgo del evaluador: docs/db/schema.sql sigue siendo la
      # fuente de docker-compose.db.yml (entorno solo-de-base-de-datos que
      # usan las evidencias de planes de consulta de la Entrega 4), pero
      # nada comprobaba automaticamente que ese archivo siga equivaliendo
      # al esquema real que arman las migraciones de los seis servicios.
      # Este job levanta docker-compose.db.yml (que solo aplica schema.sql,
      # sin ningun microservicio Spring ni Flyway) y compara sus tablas
      # contra el mismo docs/db/tablas-esperadas.txt que usa el job
      # "db-migrations-clean-start" para las migraciones: si alguien agrega
      # una tabla en un lado y se olvida del otro, este diff falla.
      - name: Levantar CRDB con solo schema.sql (docker-compose.db.yml)
        run: |
          # Los tres nodos y crdb-init se levantan JUNTOS: crdb-init es quien
          # corre "cockroach init" para formar el cluster, y crdb-1/2/3 nunca
          # se ponen "healthy" sin eso -- son circulares entre si. --wait aqui
          # solo espera a los nodos (crdb-init no tiene healthcheck).
          docker compose -f docker-compose.db.yml up -d --wait --wait-timeout 180
          
          # tiendatech-crdb-init no tiene healthcheck (es un contenedor de un solo
          # uso que aplica schema.sql y termina), asi que "docker compose up --wait"
          # no lo espera -- solo espera a que crdb-1/2/3 esten healthy. Sin esto, el
          # paso de verificacion siguiente corria mientras crdb-init todavia estaba
          # aplicando schema.sql (o ni siquiera habia empezado), y fallaba con
          # "database tiendatech does not exist". Se espera aqui explicitamente a
          # que el contenedor termine (exited) antes de seguir.
          echo "Esperando a que tiendatech-crdb-init aplique schema.sql..."
          estado=""
          for i in $(seq 1 60); do
            estado=$(docker inspect -f '{{.State.Status}}' tiendatech-crdb-init)
            if [ "$estado" = "exited" ]; then
              break
            fi
            sleep 2
          done
          docker logs tiendatech-crdb-init
          codigo=$(docker inspect -f '{{.State.ExitCode}}' tiendatech-crdb-init)
          if [ "$estado" != "exited" ] || [ "$codigo" != "0" ]; then
            echo "tiendatech-crdb-init no termino correctamente (estado=$estado, exit=$codigo)"
            exit 1
          fi

      - name: Verificar que schema.sql produce las mismas 35 tablas
        run: |
          cat > /tmp/verificar-schema-sql.sql <<'SQL'
          SELECT table_schema || '.' || table_name AS tabla
          FROM information_schema.tables
          WHERE table_schema IN ('usuarios','pedidos','productos','inventario','ordenes_proveedores','ventas')
          ORDER BY 1;
          SQL
          docker compose -f docker-compose.db.yml exec -T tiendatech-crdb-1 \
            cockroach sql --insecure --host=localhost:26257 --database=tiendatech \
            --format=csv --file=/dev/stdin < /tmp/verificar-schema-sql.sql \
            | tail -n +2 | tr -d '\r' | sort > /tmp/tablas-schema-sql.txt
          sort docs/db/tablas-esperadas.txt -o /tmp/tablas-esperadas.txt

          echo "--- Tablas creadas por docs/db/schema.sql ---"
          cat /tmp/tablas-schema-sql.txt
          echo "--- Diferencia contra docs/db/tablas-esperadas.txt (vacio = OK) ---"
          diff /tmp/tablas-esperadas.txt /tmp/tablas-schema-sql.txt

      - name: Apagar el sistema
        if: always()
        run: docker compose -f docker-compose.db.yml down -v

  armado-ia-tests:
    name: armado-ia quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/armado-ia/requirements.txt
            services/armado-ia/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/armado-ia
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/armado-ia
        run: python -m pytest --junit-xml=reports/pytest-junit.xml

      - name: Run lint (ruff)
        working-directory: services/armado-ia
        run: python -m ruff check .

      - name: Upload armado-ia reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armado-ia-test-reports
          path: services/armado-ia/reports/
          if-no-files-found: ignore
