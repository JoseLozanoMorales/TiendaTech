name: CI

on:
  push:
    branches: [main, feature/entrega-3, feature/entrega-4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  csv-line-endings:
    name: CSV line endings (LF)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify CSV files use LF line endings
        run: |
          files=$(git grep -l $'\r' -- '*.csv' '*.tsv' 'docs/evidencias/*-e4.txt' || true)
          if [ -n "$files" ]; then
            echo "CSV con CRLF detectado (deben normalizarse a LF via .gitattributes):"
            echo "$files"
            exit 1
          fi

  openapi-contracts:
    name: OpenAPI generation and route coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/openapi/requirements.txt
            services/armado-ia/requirements.txt
      - name: Install OpenAPI export and validation dependencies
        run: pip install -r scripts/openapi/requirements.txt
      - name: Test contract validation failures
        run: python -m unittest discover -s scripts/openapi -p 'test_*.py' -v
      - name: Regenerate and compare all contracts
        run: python scripts/openapi/generate.py --check
      - name: Preserve framework exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-framework-exports
          path: services/*/target/openapi/*.json
          if-no-files-found: ignore

  manuscript-quality:
    name: Validar evidencia y compilar manuscrito (E4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código con historial completo
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 es obligatorio aquí: el validador resuelve commits
          # históricos citados en el manuscrito (no solo HEAD). Un clon
          # superficial (el default) haría que git no encuentre esos objetos
          # y el validador reportaría como "archivo inexistente" algo que sí
          # existe, solo que fuera del historial descargado.
          fetch-depth: 0

      - name: Validar referencias de evidencia citadas en el manuscrito
        run: python3 scripts/validate_evidence_refs.py

      - name: Compilar PFC4.tex (imagen TeX Live completa; latexmk resuelve pdflatex/biber)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PFC4.tex
          working_directory: docs/entrega4

      - name: Conservar el PDF compilado como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PFC4-compilado
          path: docs/entrega4/PFC4.pdf
          if-no-files-found: ignore

  backend-complexity:
    name: Complejidad ciclomatica del backend (PMD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Medir complejidad ciclomatica de los 7 servicios Java
        shell: pwsh
        run: ./scripts/measure-cyclomatic-complexity.ps1

      - name: Fallar si algun metodo alcanza el umbral (>=10)
        shell: pwsh
        run: |
          $rows = Import-Csv docs/experimentos/resultados/iso25010/complejidad/summary.csv
          $rows | Format-Table -AutoSize
          $incumple = $rows | Where-Object { $_.status -ne "CUMPLE" }
          if ($incumple) {
            Write-Host "::error::Complejidad >= 10 en: $($incumple.module -join ', ')"
            exit 1
          }

      - name: Conservar reportes de PMD como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-complejidad
          path: docs/experimentos/resultados/iso25010/complejidad/
          if-no-files-found: ignore

  web-quality:
    needs: backend-complexity
    if: ${{ !cancelled() }}
    name: Web lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/web/frontend/webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: Apps/web/frontend/webapp
        run: npm ci
      - name: Download freshly measured backend complexity
        uses: actions/download-artifact@v4
        with:
          name: pmd-complejidad
          path: docs/experimentos/resultados/iso25010/complejidad/
      - name: Measure web cyclomatic complexity (maximum <10)
        working-directory: Apps/web/frontend/webapp
        run: npm run complexity:report
      - name: Run web static analysis (ESLint)
        if: ${{ !cancelled() }}
        working-directory: Apps/web/frontend/webapp
        run: npm run lint:report
      - name: Upload web static analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-static-analysis
          path: |
            docs/experimentos/resultados/iso25010/complejidad/summary.csv
            docs/experimentos/resultados/iso25010/complejidad/webapp-complexity.json
            docs/experimentos/resultados/iso25010/complejidad/webapp-eslint.json
            docs/experimentos/resultados/iso25010/complejidad/webapp-eslint-summary.csv
          if-no-files-found: error
      - name: Check web and test TypeScript types
        if: ${{ !cancelled() }}
        working-directory: Apps/web/frontend/webapp
        run: npx tsc -p tsconfig.test.json
      - name: Run web unit tests with coverage (Vitest)
        id: web-tests
        if: ${{ !cancelled() }}
        working-directory: Apps/web/frontend/webapp
        run: npm run test:coverage -- --reporter=verbose
      - name: Summarize component coverage
        if: ${{ !cancelled() && steps.web-tests.outcome == 'success' }}
        working-directory: Apps/web/frontend/webapp
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { basename } from 'node:path';
          const report = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const files = Object.entries(report).filter(([key]) => key !== 'total');
          const rows = files.map(([file, m]) =>
            `| ${basename(file)} | ${m.lines.pct}% | ${m.statements.pct}% | ${m.branches.pct}% | ${m.functions.pct}% |`);
          const alcance = files.map(([file]) => basename(file)).sort().join(', ');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            ['## Cobertura web', '| Componente | Líneas | Sentencias | Ramas | Funciones |',
             '|---|---:|---:|---:|---:|', ...rows, '',
             `Alcance: ${alcance}, con servicios HTTP simulados. Se listan automáticamente desde vitest.config.ts (coverage.include).`, ''].join('\n'));
          JS
      - name: Upload web coverage
        if: ${{ !cancelled() && steps.web-tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: Apps/web/frontend/webapp/coverage/
          if-no-files-found: error

  contract-tests:
    name: Pact consumer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/contract/package-lock.json
      - name: Install contract-test dependencies
        working-directory: tests/contract
        run: npm ci
      - name: Generate and validate Pact contracts
        working-directory: tests/contract
        run: npm test
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/contract/pacts/*.json
          if-no-files-found: error

  provider-verification-usuarios:
    name: Pact provider verification (usuarios-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml
      - name: Verify usuarios-service against the local mobile-login pact
        working-directory: services/usuarios
        run: mvn -B -ntp -Ppact -Dtest=com.tiendatech.usuarios.contract.UsuariosProviderVerificationTest test

  provider-verification-productos:
    name: Pact provider verification (productos-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml
      - name: Verify productos-service against the local web-catalog pact
        working-directory: services/productos-service
        run: mvn -B -ntp -Ppact -Dtest=com.tiendatech.productos.contract.ProductosProviderVerificationTest test

  e2e-web:
    name: Playwright web E2E
    runs-on: ubuntu-latest
    # El interceptor global que respondía sin backend permitía terminar en
    # minutos; el sistema completo (3 nodos CockroachDB + 7 microservicios +
    # gateway, todos compilados desde cero) tarda bastante más en levantarse.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Apps/web/frontend/webapp/package-lock.json
            tests/e2e-web/package-lock.json
      - name: Install webapp dependencies
        working-directory: Apps/web/frontend/webapp
        run: npm ci
      - name: Install E2E dependencies
        working-directory: tests/e2e-web
        run: npm ci
      - name: Install Chromium
        working-directory: tests/e2e-web
        run: npx playwright install --with-deps chromium

      # --- Punto 13: el sistema real, no un interceptor, es lo que responde ---
      - name: Levantar el sistema completo (CRDB + microservicios + gateway)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build --wait --wait-timeout 900
      - name: Sembrar datos deterministas para las pruebas E2E
        run: |
          docker compose exec -T tiendatech-crdb-1 \
            cockroach sql --insecure --host=localhost:26257 --file=/dev/stdin \
            < docs/db/seed-e2e.sql
      - name: Verificar que el gateway responde con datos reales
        run: |
          curl --fail --silent http://localhost:8080/actuator/health
          curl --fail --silent http://localhost:8080/api/productos | grep -q 'Procesador Ryzen 7'

      - name: Run browser journeys
        working-directory: tests/e2e-web
        run: npm test
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e-web/playwright-report/
            tests/e2e-web/test-results/
          if-no-files-found: ignore
      - name: Registrar logs del sistema (diagnóstico si algo falló)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > docker-compose.log 2>&1 || true
      - name: Subir logs del sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-system-logs
          path: docker-compose.log
          if-no-files-found: ignore
      - name: Apagar el sistema
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  android-mobile:
    name: Android mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # El paquete "tools" heredado ya fue retirado por Google del
          # repositorio del SDK; el input "packages" del action lo pide por
          # defecto si no se sobreescribe, y eso rompe el paso. platform-tools
          # es lo único que necesitamos aquí (platform y build-tools se
          # instalan en el paso siguiente).
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and build Android app
        working-directory: Apps/mobile
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tiendatech-android-debug
          path: |
            Apps/mobile/app/build/outputs/apk/debug/*.apk
            Apps/mobile/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            Apps/mobile/app/build/reports/
            Apps/mobile/app/build/test-results/
          if-no-files-found: ignore

  crdb-tests:
    name: CockroachDB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/pedidos-service/pom.xml

      - name: Run pedidos-service tests with Testcontainers
        working-directory: services/pedidos-service
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crdb-test-reports
          path: services/pedidos-service/target/surefire-reports/
          if-no-files-found: ignore

  armado-ia-tests:
    name: armado-ia quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/armado-ia/requirements.txt
            services/armado-ia/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/armado-ia
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/armado-ia
        run: python -m pytest --junit-xml=reports/pytest-junit.xml

      - name: Run lint (ruff)
        working-directory: services/armado-ia
        run: python -m ruff check .

      - name: Upload armado-ia reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armado-ia-test-reports
          path: services/armado-ia/reports/
          if-no-files-found: ignore
