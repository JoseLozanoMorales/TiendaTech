name: CI

on:
  push:
    branches: [main, feature/entrega-3, feature/entrega-4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  csv-line-endings:
    name: CSV line endings (LF)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify CSV files use LF line endings
        run: |
          files=$(git grep -Il $'\r' -- '*.csv' || true)
          if [ -n "$files" ]; then
            echo "CSV con CRLF detectado (deben normalizarse a LF via .gitattributes):"
            echo "$files"
            exit 1
          fi

  manuscript-quality:
    name: Validar evidencia y compilar manuscrito (E4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código con historial completo
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 es obligatorio aquí: el validador resuelve commits
          # históricos citados en el manuscrito (no solo HEAD). Un clon
          # superficial (el default) haría que git no encuentre esos objetos
          # y el validador reportaría como "archivo inexistente" algo que sí
          # existe, solo que fuera del historial descargado.
          fetch-depth: 0

      - name: Validar referencias de evidencia citadas en el manuscrito
        run: python3 scripts/validate_evidence_refs.py

      - name: Instalar TeX Live (pdflatex + biber)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-spanish texlive-pictures \
            texlive-bibtex-extra biber

      - name: Compilar PFC4.tex (pdflatex, biber, pdflatex x2)
        working-directory: docs/entrega4
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error PFC4.tex
          biber PFC4
          pdflatex -interaction=nonstopmode -halt-on-error PFC4.tex
          pdflatex -interaction=nonstopmode -halt-on-error PFC4.tex

      - name: Conservar el PDF compilado como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PFC4-compilado
          path: docs/entrega4/PFC4.pdf
          if-no-files-found: ignore

  web-quality:
    name: Web lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/web/frontend/webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: Apps/web/frontend/webapp
        run: npm ci
      - name: Run web static analysis (ESLint)
        working-directory: Apps/web/frontend/webapp
        run: npm run lint:report
      - name: Upload web static analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-static-analysis
          path: |
            docs/experimentos/resultados/iso25010/complejidad/webapp-eslint.json
            docs/experimentos/resultados/iso25010/complejidad/webapp-eslint-summary.csv
          if-no-files-found: error
      - name: Check web and test TypeScript types
        working-directory: Apps/web/frontend/webapp
        run: npx tsc -p tsconfig.test.json
      - name: Run web unit tests with coverage (Vitest)
        working-directory: Apps/web/frontend/webapp
        run: npm run test:coverage -- --reporter=verbose
      - name: Summarize component coverage
        working-directory: Apps/web/frontend/webapp
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { basename } from 'node:path';
          const report = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const rows = Object.entries(report).map(([file, m]) =>
            `| ${basename(file)} | ${m.lines.pct}% | ${m.statements.pct}% | ${m.branches.pct}% | ${m.functions.pct}% |`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            ['## Cobertura web', '| Componente | Líneas | Sentencias | Ramas | Funciones |',
             '|---|---:|---:|---:|---:|', ...rows, '',
             'Alcance: CartView, CheckoutView y AdminView completos, con servicios HTTP simulados.', ''].join('\n'));
          JS
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: Apps/web/frontend/webapp/coverage/
          if-no-files-found: error

  contract-tests:
    name: Pact consumer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/contract/package-lock.json
      - name: Install contract-test dependencies
        working-directory: tests/contract
        run: npm ci
      - name: Generate and validate Pact contracts
        working-directory: tests/contract
        run: npm test
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/contract/pacts/*.json
          if-no-files-found: error

  e2e-web:
    name: Playwright web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Apps/web/frontend/webapp/package-lock.json
            tests/e2e-web/package-lock.json
      - name: Install webapp dependencies
        working-directory: Apps/web/frontend/webapp
        run: npm ci
      - name: Install E2E dependencies
        working-directory: tests/e2e-web
        run: npm ci
      - name: Install Chromium
        working-directory: tests/e2e-web
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        working-directory: tests/e2e-web
        run: npm test
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e-web/playwright-report/
            tests/e2e-web/test-results/
          if-no-files-found: ignore

  android-mobile:
    name: Android mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify committed mobile deliverables
        working-directory: release
        run: sha256sum -c tiendatech-debug.apk.sha256

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and build Android app
        working-directory: Apps/mobile
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tiendatech-android-debug
          path: |
            Apps/mobile/app/build/outputs/apk/debug/*.apk
            Apps/mobile/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - name: Prepare installable mobile deliverables
        run: |
          cp Apps/mobile/app/build/outputs/apk/debug/app-debug.apk release/tiendatech-debug.apk
          cd release
          sha256sum tiendatech-debug.apk > tiendatech-debug.apk.sha256
          sha256sum -c tiendatech-debug.apk.sha256

      - name: Upload mobile deliverables
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release
          path: |
            release/tiendatech-debug.apk
            release/tiendatech-debug.apk.sha256
          if-no-files-found: error

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            Apps/mobile/app/build/reports/
            Apps/mobile/app/build/test-results/
          if-no-files-found: ignore

  publish-mobile:
    name: Publish Android prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [csv-line-endings, web-quality, contract-tests, e2e-web, android-mobile, crdb-tests, armado-ia-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-release
          path: release
      - name: Verify and publish APK with checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: mobile-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cd release
          sha256sum -c tiendatech-debug.apk.sha256
          cat > /tmp/mobile-release-notes.md <<'EOF'
          APK debug instalable de TiendaTech (Android 8.0 o posterior).
          Firmado con clave de depuración; no es una versión de producción.
          Verificar: sha256sum -c tiendatech-debug.apk.sha256
          Instalar: adb install -r tiendatech-debug.apk
          Backend predeterminado: http://10.0.2.2:8180/ (emulador).
          Instrucciones completas: release/README.md en el commit de esta entrega.
          EOF
          gh release create "$RELEASE_TAG" tiendatech-debug.apk tiendatech-debug.apk.sha256 \
            --target "$RELEASE_SHA" --title "Android debug $RELEASE_TAG" \
            --prerelease --notes-file /tmp/mobile-release-notes.md

  crdb-tests:
    name: CockroachDB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/pedidos-service/pom.xml

      - name: Run pedidos-service tests with Testcontainers
        working-directory: services/pedidos-service
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crdb-test-reports
          path: services/pedidos-service/target/surefire-reports/
          if-no-files-found: ignore

  armado-ia-tests:
    name: armado-ia quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/armado-ia/requirements.txt
            services/armado-ia/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/armado-ia
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/armado-ia
        run: python -m pytest --junit-xml=reports/pytest-junit.xml

      - name: Run lint (ruff)
        working-directory: services/armado-ia
        run: python -m ruff check .

      - name: Upload armado-ia reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armado-ia-test-reports
          path: services/armado-ia/reports/
          if-no-files-found: ignore
