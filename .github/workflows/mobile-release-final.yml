name: Final tagged delivery

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-release-final.yml"
      - "CITATION.cff"
      - "docs/evidencias/cierre-punto47.md"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-definition:
    name: Validate final delivery definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version metadata and required sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'version: "4.1.0"' CITATION.cff
          grep -Fqx 'date-released: "2026-09-18"' CITATION.cff
          test "$(head -c 5 docs/entrega4/PFC4.pdf)" = '%PDF-'
          test -s release/jose-lozano-certificado-publico.pem
          test -f Apps/mobile/app/build.gradle.kts

  publish-final-delivery:
    name: Build and publish immutable final delivery
    if: github.event_name == 'push'
    needs: validate-definition
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require annotated tag at current main tip
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            --no-tags
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          source_commit="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          printf 'tag_commit=%s\nmain_commit=%s\n' "$source_commit" "$main_commit"
          test "$source_commit" = "$main_commit"
          expected_version="${GITHUB_REF_NAME#v}"
          actual_version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' CITATION.cff)"
          test "$actual_version" = "$expected_version"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::La release $GITHUB_REF_NAME ya existe; no se mezclaran activos."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build exactly one signed APK from the tagged tree
        working-directory: Apps/mobile
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TIENDATECH_KEYSTORE_BASE64 }}
          TIENDATECH_KEYSTORE_PASSWORD: ${{ secrets.TIENDATECH_KEYSTORE_PASSWORD }}
          TIENDATECH_KEY_ALIAS: ${{ secrets.TIENDATECH_KEY_ALIAS }}
          TIENDATECH_KEY_PASSWORD: ${{ secrets.TIENDATECH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 TIENDATECH_KEYSTORE_PASSWORD TIENDATECH_KEY_ALIAS TIENDATECH_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Falta secreto: $name"; exit 1; fi
          done
          umask 077
          export TIENDATECH_KEYSTORE_PATH="$RUNNER_TEMP/tiendatech-release.p12"
          trap 'rm -f "$TIENDATECH_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TIENDATECH_KEYSTORE_PATH"
          ./gradlew lintRelease assembleRelease --no-daemon --no-configuration-cache --no-build-cache

      - name: Verify and assemble delivery
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir final-delivery
          cp Apps/mobile/app/build/outputs/apk/release/app-release.apk final-delivery/tiendatech-release.apk
          cp docs/entrega4/PFC4.pdf final-delivery/PFC4.pdf
          cp release/jose-lozano-certificado-publico.pem final-delivery/jose-lozano-certificado-publico.pem
          cp CITATION.cff final-delivery/CITATION.cff

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            final-delivery/tiendatech-release.apk > final-delivery/apksigner.txt
          grep -Fqx 'Signer #1 certificate SHA-256 digest: 6ad168c152fd8090144c25c75d630116cc912fbe60b25150a81d88f354bc8bbd' \
            final-delivery/apksigner.txt
          certificate_digest="$(openssl x509 -in final-delivery/jose-lozano-certificado-publico.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$certificate_digest" = 6ad168c152fd8090144c25c75d630116cc912fbe60b25150a81d88f354bc8bbd
          (cd final-delivery && sha256sum tiendatech-release.apk > tiendatech-release.apk.sha256)
          (cd final-delivery && sha256sum -c tiendatech-release.apk.sha256)
          git show "$SOURCE_COMMIT:Apps/mobile/app/build.gradle.kts" | sha256sum | \
            sed 's/  -$/  Apps\/mobile\/app\/build.gradle.kts/' > final-delivery/gradle-build-script.sha256

          tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{tag}")"
          tagger="$(git for-each-ref --format='%(taggername) <%(taggeremail)>' "refs/tags/$GITHUB_REF_NAME")"
          tagged_at="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$GITHUB_REF_NAME")"
          cat > final-delivery/provenance.txt <<EOF
          repository=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          tag=$GITHUB_REF_NAME
          tag_type=annotated
          tag_object=$tag_object
          tagger=$tagger
          tagged_at=$tagged_at
          source_commit=$SOURCE_COMMIT
          workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          apk_origin=compiled_and_signed_from_tagged_tree
          pdf_origin=docs/entrega4/PFC4.pdf_in_tagged_tree
          EOF

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("final-delivery")
          assets = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  data = path.read_bytes()
                  assets.append({"name": path.name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          manifest = {"schema": "tiendatech-final-delivery-v1", "tag": os.environ["GITHUB_REF_NAME"], "source_commit": os.environ["SOURCE_COMMIT"], "assets": assets}
          (root / "release-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          (cd final-delivery && sha256sum \
            PFC4.pdf CITATION.cff apksigner.txt gradle-build-script.sha256 \
            jose-lozano-certificado-publico.pem provenance.txt release-manifest.json \
            tiendatech-release.apk tiendatech-release.apk.sha256 > SHA256SUMS.txt)
          (cd final-delivery && sha256sum -c SHA256SUMS.txt)

      - name: Upload immutable delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-delivery-${{ github.ref_name }}
          path: final-delivery/
          if-no-files-found: error

      - name: Publish definitive GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" final-delivery/* \
            --verify-tag --target "$SOURCE_COMMIT" \
            --title "TiendaTech $GITHUB_REF_NAME - entrega final" --latest \
            --notes "Entrega final trazable al commit $SOURCE_COMMIT. APK compilado y firmado desde el tag; manuscrito, certificado, sumas, manifiesto y procedencia reunidos en una sola ejecucion. Verificar con: sha256sum -c SHA256SUMS.txt"
