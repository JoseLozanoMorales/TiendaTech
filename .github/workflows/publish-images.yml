name: Publicar imágenes Docker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI-CD quality gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: frontend
            context: Apps/web/frontend
            dockerfile: Apps/web/frontend/Dockerfile
          - image: usuarios
            context: services/usuarios
            dockerfile: services/usuarios/Dockerfile
          - image: productos
            context: services/productos-service
            dockerfile: services/productos-service/Dockerfile
          - image: inventario
            context: .
            dockerfile: services/inventario-service/Dockerfile
          - image: pedidos
            context: .
            dockerfile: services/pedidos-service/Dockerfile
          - image: ventas
            context: services/ventas-service
            dockerfile: services/ventas-service/Dockerfile
          - image: ordenes-proveedores
            context: services/ordenes-proveedores-service
            dockerfile: services/ordenes-proveedores-service/Dockerfile
          - image: armado-ia
            context: services/armado-ia
            dockerfile: services/armado-ia/Dockerfile

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Calcular versión
        id: version
        shell: bash
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Calcular repositorio de imagen (minusculas, lo exige GHCR)
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Habilitar emulación ARM64
        uses: docker/setup-qemu-action@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: published
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.image }}-${{ steps.version.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max

      - name: Verificar el índice publicado y registrar su digest
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ steps.repo.outputs.name }}
          IMAGE_SERVICE: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$IMAGE_DIGEST" --raw > image-index.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          index = json.loads(Path("image-index.json").read_text())
          platforms = sorted({
              f"{p.get('os')}/{p.get('architecture')}"
              for entry in index.get("manifests", [])
              for p in [entry.get("platform", {})]
              if p.get("os") == "linux"
          })
          if not {"linux/amd64", "linux/arm64"}.issubset(platforms):
              raise SystemExit(f"Arquitecturas publicadas incompletas: {platforms}")
          record = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "service": os.environ["IMAGE_SERVICE"],
              "image": os.environ["IMAGE_REPOSITORY"] + "@" + os.environ["IMAGE_DIGEST"],
              "platforms": platforms,
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          Path("image-publication.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Conservar prueba de publicación por imagen
        uses: actions/upload-artifact@v4
        with:
          name: image-publication-${{ matrix.image }}
          path: |
            image-index.json
            image-publication.json
          if-no-files-found: error
