name: Integridad de datos

on:
  push:
    branches: [main, feature/entrega-3, feature/entrega-4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    name: Integridad de todos los datos CSV y TSV
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que el verificador detecta alteraciones y ausencias
        run: python -m unittest discover -s scripts -p test_data_checksums.py -v
      - name: Verificar inventario completo y sumas publicadas
        run: python scripts/check_data_checksums.py
      - name: Probar detección de alteraciones en campañas
        run: python -m unittest discover -s experiments/paso8 -p test_campaign_checksums.py -v
      - name: Verificar manifiestos de campañas sobre checkout limpio
        run: python experiments/paso8/campaign_checksums.py
      - name: Probar detección de alteraciones en evidencia adicional (trazas, oráculos, JSON sueltos)
        run: python -m unittest discover -s scripts -p test_check_raw_evidence_checksums.py -v
      - name: Verificar checksums de evidencia adicional sin manifiesto propio
        run: python scripts/check_raw_evidence_checksums.py
      - name: Probar detección de BOM UTF-8 (falsos positivos y casos límite)
        run: python -m unittest discover -s scripts -p test_check_no_bom.py -v
      - name: Verificar ausencia de BOM UTF-8 en archivos versionados
        run: python scripts/check_no_bom.py
      - name: Probar detección de reescrituras de checksum sin justificar
        run: python -m unittest discover -s scripts -p test_check_checksum_rewrites.py -v
      - name: Verificar que ninguna suma existente se reescribió sin justificación
        run: python scripts/check_checksum_rewrites.py --base "${{ github.event.before || format('{0}^', github.sha) }}"
      - name: Probar verificador de assets pesados de la release
        run: python -m unittest discover -s scripts -p test_verify_release_assets.py -v
      - name: Verificar assets pesados publicados fuera del árbol
        run: python scripts/verify_release_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Probar guardián de higiene del repositorio
        run: python -m unittest discover -s scripts -p test_check_repository_hygiene.py -v
      - name: Impedir artefactos pesados en el árbol
        run: python scripts/check_repository_hygiene.py
