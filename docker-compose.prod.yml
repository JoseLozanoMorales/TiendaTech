name: tiendatech

x-service-defaults: &service-defaults
  restart: unless-stopped
  pull_policy: always
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - tiendatech-net

x-crdb-environment: &crdb-environment
  CRDB_DATASOURCE_URL: ${CRDB_DATASOURCE_URL:?CRDB_DATASOURCE_URL debe existir en .env}
  CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:?CRDB_DATASOURCE_USERNAME debe existir en .env}
  CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
  CRDB_RETRY_MAX_ATTEMPTS: ${CRDB_RETRY_MAX_ATTEMPTS:-3}
  CRDB_RETRY_DELAY_MS: ${CRDB_RETRY_DELAY_MS:-100}
  CRDB_POOL_MAX_SIZE: ${CRDB_POOL_MAX_SIZE:-10}
  CRDB_POOL_MIN_IDLE: ${CRDB_POOL_MIN_IDLE:-2}

x-crdb-volumes: &crdb-volumes
  - "${CRDB_CERTS_DIR:-./crdb-certs}:/app/crdb-certs:ro"

services:
  tiendatech-productos:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:productos-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN debe existir en .env}
      VENTAS_SERVICE_URL: http://tiendatech-ventas:8086
      <<: *crdb-environment
      SERVER_PORT: "8081"
    volumes: *crdb-volumes
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  tiendatech-inventario:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:inventario-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN debe existir en .env}
      <<: *crdb-environment
      SERVER_PORT: "8082"
      RESERVATION_TCP_PORT: "9091"
      RESERVATION_GRPC_PORT: "9092"
    volumes: *crdb-volumes
    ports:
      - "${RESERVATION_BIND_ADDRESS:-127.0.0.1}:9091:9091"
      - "${RESERVATION_BIND_ADDRESS:-127.0.0.1}:9092:9092"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  tiendatech-ventas:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:ventas-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN debe existir en .env}
      <<: *crdb-environment
      SERVER_PORT: "8086"
      INVENTARIO_SERVICE_URL: http://tiendatech-inventario:8082
    volumes: *crdb-volumes
    depends_on:
      tiendatech-inventario:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  tiendatech-usuarios:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:usuarios-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      <<: *crdb-environment
      SERVER_PORT: "8085"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      TT_MAIL_USERNAME: ${TT_MAIL_USERNAME:-}
      TT_MAIL_PASSWORD: ${TT_MAIL_PASSWORD:-}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${MAIL_READ_TIMEOUT_MS:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${MAIL_WRITE_TIMEOUT_MS:-5000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OTP_MAIL_FALLBACK_ENABLED: ${OTP_MAIL_FALLBACK_ENABLED:-false}
      APP_UPLOAD_ROOT: /app/uploads
    volumes:
      - "${CRDB_CERTS_DIR:-./crdb-certs}:/app/crdb-certs:ro"
      - usuarios-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  tiendatech-ordenes-proveedores:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:ordenes-proveedores-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN debe existir en .env}
      <<: *crdb-environment
      SERVER_PORT: "8084"
      INVENTARIO_SERVICE_URL: http://tiendatech-inventario:8082
    volumes: *crdb-volumes
    depends_on:
      tiendatech-inventario:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  tiendatech-armado-ia:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:armado-ia-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      SERVER_PORT: "8087"
      PRODUCTOS_SERVICE_URL: http://tiendatech-productos:8081
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
    depends_on:
      tiendatech-productos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  tiendatech-pedidos:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:pedidos-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN debe existir en .env}
      <<: *crdb-environment
      SERVER_PORT: "8083"
      PEDIDOS_IDEMPOTENCIA_ENABLED: "true"
      COORD: ${COORD:-2pc}
      VENTAS_SERVICE_URL: http://tiendatech-ventas:8086
      PRODUCTOS_SERVICE_URL: http://tiendatech-productos:8081
      USUARIOS_SERVICE_URL: http://tiendatech-usuarios:8085
      RESERVATION_TCP_HOST: tiendatech-inventario
      RESERVATION_TCP_PORT: "9091"
    volumes: *crdb-volumes
    depends_on:
      tiendatech-ventas:
        condition: service_healthy
      tiendatech-productos:
        condition: service_healthy
      tiendatech-usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  tiendatech-gateway:
    <<: *service-defaults
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY debe existir en .env}:frontend-${IMAGE_TAG:?IMAGE_TAG debe existir en .env (usa el hash corto del commit publicado)}
    environment:
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      GATEWAY_RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-300}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      GATEWAY_RATE_LIMIT_MAX_CLIENTS: ${GATEWAY_RATE_LIMIT_MAX_CLIENTS:-10000}
      USUARIOS_SERVICE_URL: http://tiendatech-usuarios:8085
      PRODUCTOS_SERVICE_URL: http://tiendatech-productos:8081
      INVENTARIO_SERVICE_URL: http://tiendatech-inventario:8082
      PEDIDOS_SERVICE_URL: http://tiendatech-pedidos:8083
      ORDENES_PROVEEDORES_SERVICE_URL: http://tiendatech-ordenes-proveedores:8084
      VENTAS_SERVICE_URL: http://tiendatech-ventas:8086
      ARMADO_IA_SERVICE_URL: http://tiendatech-armado-ia:8087
      CRDB_HEALTH_URL: http://tiendatech-crdb-1:8080
      COORD: ${COORD:-2pc}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET debe existir en .env}
    depends_on:
      tiendatech-pedidos:
        condition: service_healthy
      tiendatech-ordenes-proveedores:
        condition: service_healthy
      tiendatech-armado-ia:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-8180}:8080"

  tiendatech-caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    depends_on:
      tiendatech-gateway:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  tiendatech-net:
    name: tiendatech-net
    driver: bridge

volumes:
  usuarios-uploads:
  caddy-data:
  caddy-config:
