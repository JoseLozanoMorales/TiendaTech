global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tiendatech-java-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - tiendatech-productos:8081
          - tiendatech-inventario:8082
          - tiendatech-pedidos:8083
          - tiendatech-ordenes-proveedores:8084
          - tiendatech-usuarios:8085
          - tiendatech-ventas:8086
  - job_name: tiendatech-armado-ia
    metrics_path: /metrics
    static_configs:
      - targets: [tiendatech-armado-ia:8087]
  # Punto 17 de la guia de cierre: /metrics del Gateway ahora exige el token
  # de observabilidad (ver JwtGatewayFilter y OBSERVABILITY_TOKEN en
  # docker-compose.yml), a diferencia de los 6 microservicios de arriba, que
  # no estan expuestos por el Gateway y no lo requieren. Job separado para
  # poder mandar el bearer_token solo a este target.
  # Este archivo no soporta sustitucion de variables de entorno: si se
  # cambia OBSERVABILITY_TOKEN en docker-compose.yml para un despliegue
  # real, este valor debe actualizarse a mano para que coincida.
  - job_name: tiendatech-gateway
    metrics_path: /metrics
    bearer_token: TiendaTechObservabilidadToken2026Seguro
    static_configs:
      - targets: [tiendatech-gateway:8080]
