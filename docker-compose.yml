services:
  tiendatech-pedidos:
    build:
      context: .
      dockerfile: services/pedidos-service/Dockerfile
    image: tiendatech/pedidos:local
    container_name: tiendatech-pedidos
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-TiendaTechInternalServiceToken2026}
      PEDIDOS_IDEMPOTENCIA_ENABLED: "true"
      COORD: ${COORD:-2pc}
      SERVER_PORT: 8083
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      CRDB_RETRY_MAX_ATTEMPTS: 3
      CRDB_RETRY_DELAY_MS: 100
      HTTP_CLIENT_READ_TIMEOUT_MS: ${HTTP_CLIENT_READ_TIMEOUT_MS:-7000}
      FACTURA_HTTP_CLIENT_READ_TIMEOUT_MS: ${FACTURA_HTTP_CLIENT_READ_TIMEOUT_MS:-30000}
      VENTAS_SERVICE_URL: http://tiendatech-ventas:8086
      PRODUCTOS_SERVICE_URL: http://tiendatech-productos:8081
      USUARIOS_SERVICE_URL: http://tiendatech-usuarios:8085
      RESERVATION_TCP_HOST: tiendatech-inventario
      RESERVATION_TCP_PORT: 9091
      RESERVATION_TCP_READ_TIMEOUT_MS: ${RESERVATION_TCP_READ_TIMEOUT_MS:-30000}
    depends_on:
      tiendatech-crdb-init:
        condition: service_completed_successfully
      tiendatech-ventas:
        condition: service_started
      tiendatech-productos:
        condition: service_started
      tiendatech-usuarios:
        condition: service_started
      tiendatech-jaeger:
        condition: service_started
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  tiendatech-productos:
    build:
      context: services/productos-service
    image: tiendatech/productos:local
    container_name: tiendatech-productos
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-TiendaTechInternalServiceToken2026}
      VENTAS_SERVICE_URL: http://tiendatech-ventas:8086
      SERVER_PORT: 8081
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
    depends_on:
      tiendatech-crdb-init:
        condition: service_completed_successfully
      tiendatech-jaeger:
        condition: service_started
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # tiendatech-armado-ia: sin datasource propio (servicio de calculo puro sobre
  # el catalogo de tiendatech-productos via HTTP, no persiste nada). Las
  # credenciales de AWS NUNCA van literales aqui: se pasan desde el .env del
  # host via ${VAR}; si faltan, el servicio sigue funcionando con el
  # fallback deterministico de explicacion (ver ExplicacionService).
  tiendatech-armado-ia:
    build:
      context: services/armado-ia
    image: tiendatech/armado-ia:local
    container_name: tiendatech-armado-ia
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      SERVER_PORT: 8087
      PRODUCTOS_SERVICE_URL: http://tiendatech-productos:8081
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
    depends_on:
      tiendatech-productos:
        condition: service_started
      tiendatech-jaeger:
        condition: service_started
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  tiendatech-inventario:
    build:
      context: .
      dockerfile: services/inventario-service/Dockerfile
    image: tiendatech/inventario:local
    container_name: tiendatech-inventario
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-TiendaTechInternalServiceToken2026}
      SERVER_PORT: 8082
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      RESERVATION_TCP_PORT: 9091
      RESERVATION_GRPC_PORT: 9092
      # Variables propias: CRDB_RETRY_MAX_ATTEMPTS del .env pertenece a
      # pedidos-service y vale 3; no debe recortar los reintentos de reservas.
      CRDB_RETRY_MAX_ATTEMPTS: ${INVENTARIO_CRDB_RETRY_MAX_ATTEMPTS:-10}
      CRDB_RETRY_INITIAL_DELAY_MS: ${INVENTARIO_CRDB_RETRY_INITIAL_DELAY_MS:-100}
      CRDB_RETRY_MAX_DELAY_MS: ${INVENTARIO_CRDB_RETRY_MAX_DELAY_MS:-2000}
    depends_on:
      tiendatech-crdb-init:
        condition: service_completed_successfully
      tiendatech-jaeger:
        condition: service_started
    ports:
      - "${RESERVATION_BIND_ADDRESS:-127.0.0.1}:9091:9091"
      - "${RESERVATION_BIND_ADDRESS:-127.0.0.1}:9092:9092"
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  tiendatech-ventas:
    build:
      context: services/ventas-service
    image: tiendatech/ventas:local
    container_name: tiendatech-ventas
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-TiendaTechInternalServiceToken2026}
      SERVER_PORT: 8086
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      INVENTARIO_SERVICE_URL: http://tiendatech-inventario:8082
      INVENTARIO_HTTP_CLIENT_READ_TIMEOUT_MS: ${INVENTARIO_HTTP_CLIENT_READ_TIMEOUT_MS:-30000}
      EXPERIMENT_FAULT_INJECTION_ENABLED: ${EXPERIMENT_FAULT_INJECTION_ENABLED:-false}
      EXPERIMENT_FAULT_DELAY_MS: ${EXPERIMENT_FAULT_DELAY_MS:-5000}
      EXPERIMENT_OMISSION_DELAY_MS: ${EXPERIMENT_OMISSION_DELAY_MS:-9000}
    depends_on:
      tiendatech-crdb-init:
        condition: service_completed_successfully
      tiendatech-inventario:
        condition: service_started
      tiendatech-jaeger:
        condition: service_started
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  tiendatech-ordenes-proveedores:
    build:
      context: services/ordenes-proveedores-service
    image: tiendatech/ordenes-proveedores:local
    container_name: tiendatech-ordenes-proveedores
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-TiendaTechInternalServiceToken2026}
      SERVER_PORT: 8084
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      INVENTARIO_SERVICE_URL: http://tiendatech-inventario:8082
    depends_on:
      tiendatech-crdb-init:
        condition: service_completed_successfully
      tiendatech-inventario:
        condition: service_started
      tiendatech-jaeger:
        condition: service_started
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  tiendatech-usuarios:
    build:
      context: services/usuarios
    image: tiendatech/usuarios:local
    container_name: tiendatech-usuarios
    environment:
      SERVER_PORT: 8085
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      TT_MAIL_USERNAME: ${TT_MAIL_USERNAME:-}
      TT_MAIL_PASSWORD: ${TT_MAIL_PASSWORD:-}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${MAIL_READ_TIMEOUT_MS:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${MAIL_WRITE_TIMEOUT_MS:-5000}
      COOKIE_SECURE: "false"
      OTP_MAIL_FALLBACK_ENABLED: ${OTP_MAIL_FALLBACK_ENABLED:-true}
    depends_on:
      tiendatech-crdb-init:
        condition: service_completed_successfully
      tiendatech-jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - default
      - tiendatech-net

  tiendatech-gateway:
    build:
      context: Apps/web/frontend
    image: tiendatech/gateway:local
    container_name: tiendatech-gateway
    ports:
      - "0.0.0.0:8180:8080"
    environment:
      SERVER_PORT: 8080
      GATEWAY_RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-300}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      GATEWAY_RATE_LIMIT_MAX_CLIENTS: ${GATEWAY_RATE_LIMIT_MAX_CLIENTS:-10000}
      USUARIOS_SERVICE_URL: http://tiendatech-usuarios:8085
      PRODUCTOS_SERVICE_URL: http://tiendatech-productos:8081
      INVENTARIO_SERVICE_URL: http://tiendatech-inventario:8082
      PEDIDOS_SERVICE_URL: http://tiendatech-pedidos:8083
      ORDENES_PROVEEDORES_SERVICE_URL: http://tiendatech-ordenes-proveedores:8084
      VENTAS_SERVICE_URL: http://tiendatech-ventas:8086
      ARMADO_IA_SERVICE_URL: http://tiendatech-armado-ia:8087
      CRDB_HEALTH_URL: http://tiendatech-crdb-1:8080
      COORD: ${COORD:-2pc}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
    depends_on:
      tiendatech-usuarios:
        condition: service_started
      tiendatech-productos:
        condition: service_started
      tiendatech-inventario:
        condition: service_started
      tiendatech-pedidos:
        condition: service_started
      tiendatech-ordenes-proveedores:
        condition: service_started
      tiendatech-ventas:
        condition: service_started
      tiendatech-armado-ia:
        condition: service_started
      tiendatech-jaeger:
        condition: service_started
    networks:
      - default
      - tiendatech-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # --max-offset=5s en los 3 nodos: CockroachDB por defecto exige que el reloj
  # de cada nodo (y del cliente que ejecuta sql/schema.sql) no diverja mas de
  # 500ms del resto del cluster, algo que el reloj del host bajo WSL2/Docker
  # Desktop supera con facilidad (ya se vio el mismo "remote wall time is too
  # far ahead" en el nodo unico del Paso 5.6, resuelto igual). No introduce
  # sesgo en las mediciones de latencia de otros pasos: solo amplia la
  # tolerancia de desfase aceptada, no altera como se miden los tiempos.
  tiendatech-crdb-1:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-1
    command: start --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --advertise-addr=tiendatech-crdb-1:26257 --join=tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257 --max-offset=5s
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8088:8080"
    volumes:
      - crdb-1-data:/cockroach/cockroach-data
    networks: [tiendatech-net]

  tiendatech-crdb-2:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-2
    command: start --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --advertise-addr=tiendatech-crdb-2:26257 --join=tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257 --max-offset=5s
    volumes:
      - crdb-2-data:/cockroach/cockroach-data
    networks: [tiendatech-net]

  tiendatech-crdb-3:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-3
    command: start --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --advertise-addr=tiendatech-crdb-3:26257 --join=tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257 --max-offset=5s
    volumes:
      - crdb-3-data:/cockroach/cockroach-data
    networks: [tiendatech-net]

  tiendatech-crdb-init:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sleep 5;
        cockroach init --insecure --host=tiendatech-crdb-1:26257 || true;
        until cockroach sql --insecure --host=tiendatech-crdb-1:26257 --execute='SELECT 1'; do sleep 2; done;
        cockroach sql --insecure --host=tiendatech-crdb-1:26257 --file=/schema.sql
    volumes:
      - ./docs/db/schema.sql:/schema.sql:ro
    depends_on:
      - tiendatech-crdb-1
      - tiendatech-crdb-2
      - tiendatech-crdb-3
    networks: [tiendatech-net]
    restart: "no"

  tiendatech-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: tiendatech-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - tiendatech-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # tiendatech-grafana: renderiza el panel versionado como codigo en
  # ops/observability/grafana-dashboard.json (item 5 del Paso 10). El
  # datasource de Prometheus y el propio dashboard se cargan por
  # provisioning (ops/observability/grafana/provisioning/), no por
  # importacion manual desde la UI: el panel sigue siendo codigo
  # versionado en el repo, este contenedor solo lo hace visible con datos
  # reales durante una prueba de carga. No sustituye al perfil opcional
  # grafana-cloud (remote write a un stack externo); este es 100% local.
  # tiendatech-grafana-renderer (imagen oficial grafana/grafana-image-renderer,
  # aportada por Jeremy) automatiza la captura de pantalla del panel via
  # GF_RENDERING_SERVER_URL/GF_RENDERING_CALLBACK_URL, en vez de exportar la
  # captura a mano; no cambia el datasource ni el dashboard versionado.
  tiendatech-grafana:
    image: grafana/grafana:11.3.1
    container_name: tiendatech-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://tiendatech-grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://tiendatech-grafana:3000/
    volumes:
      - ./ops/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/observability:/etc/grafana/dashboards:ro
    depends_on:
      tiendatech-prometheus:
        condition: service_healthy
      tiendatech-grafana-renderer:
        condition: service_started
    networks:
      - tiendatech-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  tiendatech-grafana-renderer:
    image: grafana/grafana-image-renderer:3.12.9
    container_name: tiendatech-grafana-renderer
    networks:
      - tiendatech-net

  # tiendatech-jaeger: colector y UI de trazado distribuido para el Paso 10.
  # jaegertracing/all-in-one (v1) quedo descontinuado por el proyecto Jaeger
  # (a partir de la v2.14 del binario unificado ya no se publica); el
  # reemplazo oficial para uso local/desarrollo es esta imagen "jaeger" v2,
  # que combina agente + colector + almacenamiento in-memory + UI en un solo
  # contenedor y trae el receptor OTLP habilitado por defecto (sin variables
  # de entorno adicionales). Recibe OTLP/HTTP en 4318 (los 6 microservicios
  # Java via Micrometer Tracing, el gateway igual, y armado-ia via el SDK de
  # Python) y OTLP/gRPC en 4317 (sin uso actual, expuesto por si se
  # necesita). UI de consulta de trazas en 16686, usada para exportar la
  # evidencia real del camino de compra.
  tiendatech-jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: tiendatech-jaeger
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - tiendatech-net

  tiendatech-alloy:
    image: grafana/alloy:v1.10.2
    container_name: tiendatech-alloy
    profiles: ["grafana-cloud"]
    command: ["run", "/etc/alloy/config.alloy"]
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USERNAME: ${GRAFANA_CLOUD_PROM_USERNAME:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
    volumes:
      - ./ops/observability/alloy.config:/etc/alloy/config.alloy:ro
    networks:
      - tiendatech-net
    depends_on:
      tiendatech-prometheus:
        condition: service_healthy

networks:
  tiendatech-net:
    name: tiendatech-net
    driver: bridge

volumes:
  prometheus-data:
  crdb-1-data:
  crdb-2-data:
  crdb-3-data:
