server:
  port: ${SERVER_PORT:8080}

tiendatech:
  services:
    usuarios: ${USUARIOS_SERVICE_URL:http://localhost:8085}
    pedidos: ${PEDIDOS_SERVICE_URL:http://localhost:8083}
    inventario: ${INVENTARIO_SERVICE_URL:http://localhost:8082}
    ventas: ${VENTAS_SERVICE_URL:http://localhost:8086}
    crdb: ${CRDB_HEALTH_URL:http://localhost:8088}
  security:
    jwt:
      # Debe ser el mismo AUTH_JWT_SECRET usado por usuarios-service para firmar tokens.
      secret: ${AUTH_JWT_SECRET:TiendaTechDistribuidaJwtSecretKey2026Seguro}
      # Rutas publicas del dominio usuarios: autenticacion, registro, OTP,
      # recuperacion de clave, catalogos geograficos y recursos estaticos.
      public-paths:
        - /api/login
        - /auth/**
        - /api/otp/**
        - /api/usuarios/crear
        - /api/usuarios/recuperar-password
        - /api/provincias/**
        - /api/ciudades/**
        - /uploads/**
        - /assets/**
        - /favicon.ico
      # Solo las lecturas del catalogo son publicas. Las escrituras sobre las
      # mismas rutas quedan protegidas por /api/**.
      public-read-paths:
        - /api/categorias/**
        - /api/marcas/**
        - /api/gamas/**
        - /api/galeria/**
        - /api/galeria_v2/**
        - /api/productos/**
        - /api/provincias/**
        - /api/ciudades/**
      protected-paths:
        - /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tiendatech-jaeger:4318/v1/traces}

spring:
  application:
    name: tiendatech-gateway
  http:
    clients:
      imperative:
        # Sin Apache HttpClient5/Jetty/Reactor Netty en el classpath, Boot usa
        # por defecto el cliente HTTP del JDK (java.net.http.HttpClient), que
        # negocia HTTP/2 en texto plano (h2c: Connection/Upgrade + HTTP2-Settings)
        # contra CUALQUIER uri http://. Spring Cloud Gateway Server WebMVC
        # reusa este mismo RestClient.Builder autoconfigurado para el proxy de
        # TODAS las rutas (ver RestClientProxyExchange), asi que el intento de
        # upgrade se manda tambien hacia tiendatech-armado-ia (uvicorn/FastAPI,
        # HTTP/1.1 unicamente), que lo rechaza (400 "Unsupported upgrade
        # request") y pierde el body en el proceso. No hay forma de
        # configurar el cliente HTTP por ruta en esta version de Gateway MVC
        # (GatewayMvcProperties/RouteProperties no lo exponen), asi que se
        # fuerza aqui, a nivel de aplicacion, el factory "simple"
        # (HttpURLConnection, HTTP/1.1 puro, sin soporte de h2c). No cambia
        # nada para las demas rutas: todos los backends del proyecto son
        # Spring/Tomcat y solo hablan HTTP/1.1.
        factory: simple

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-auth
              uri: ${USUARIOS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/auth/**

            - id: usuarios-uploads
              uri: ${USUARIOS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/uploads/**

            - id: usuarios-api
              uri: ${USUARIOS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/login,/api/usuarios/**,/api/otp/**,/api/seguridad/**,/api/provincias/**,/api/ciudades/**,/api/auditoria/**

            - id: productos-api
              uri: ${PRODUCTOS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/categorias,/api/marcas,/api/gamas,/api/galeria/**,/api/galeria_v2/**,/api/productos/**,/api/sp/almacenamientos,/api/sp/cpu,/api/sp/cpu-cooler,/api/sp/cubiertas,/api/sp/fuentes,/api/sp/gpu,/api/sp/ram,/api/sp/motherboards,/api/sp/perifericos,/api/sp/accesorios,/api/sp/productos/**,/api/sp/ivas

            - id: inventario-api
              uri: ${INVENTARIO_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/movimientos,/api/subtipos-movimiento,/api/sp/movimiento-inventario,/api/reservas/**

            - id: pedidos-api
              uri: ${PEDIDOS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/carrito/**,/api/ordenes/**,/api/metodopago/**

            - id: ordenes-proveedores-api
              uri: ${ORDENES_PROVEEDORES_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/proveedores/**,/api/ordenes-compra/**

            - id: ventas-api
              uri: ${VENTAS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/facturas/**

            - id: armado-ia-api
              uri: ${ARMADO_IA_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/armado/**
              # El 400 que uvicorn devolvia contra esta ruta se debia al
              # cliente HTTP saliente de Gateway intentando un upgrade h2c
              # (ver spring.http.clients.imperative.factory mas arriba), no a
              # una cabecera copiada de la request entrante. No hace falta
              # ningun filtro en esta ruta.
